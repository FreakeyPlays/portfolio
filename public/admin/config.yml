site_url: https://chrismerck.dev
logout_redirect_url: https://chrismerck.dev

app_title: Portfolio CMS

backend:
  name: github
  repo: FreakeyPlays/portfolio
  commit_messages:
    create: 'content({{collection}}): add "{{slug}}"'
    update: 'content({{collection}}): update "{{slug}}"'
    delete: 'content({{collection}}): remove "{{slug}}"'
    uploadMedia: 'content(media): add "{{path}}"'
    deleteMedia: 'content(media): remove "{{path}}"'
    openAuthoring: "{{message}}"

media_folder: src/assets/uploads
public_folder: /src/assets/uploads

editor:
  preview: false

output:
  omit_empty_optional_fields: true

collections:
  - name: pages
    label: Pages
    label_singular: Page
    icon: description
    folder: src/content/pages
    extension: mdx
    format: frontmatter
    create: true
    identifier_field: title
    summary: "{{title}}"
    fields:
      - {
          name: title,
          label: Title,
          widget: string,
          pattern:
            [
              '^(?!\s*(?:[Ii][Nn][Dd][Ee][Xx])\s*$).+',
              "The Homepage can be created via the name Home.",
            ],
        }
      - {
          name: description,
          label: Description,
          widget: text,
          required: false,
          hint: "Meta description. Leave empty to fall back to the site default.",
        }
      - {
          name: isPublished,
          label: Published,
          widget: boolean,
          default: false,
          required: true,
        }
      - {
          name: noIndex,
          label: Remove from Indexing,
          widget: boolean,
          default: false,
          required: true,
        }
      - {
          name: createdAt,
          label: Created at,
          widget: hidden,
          default: "{{datetime}}",
        }
      - {
          name: updatedAt,
          label: Updated at,
          widget: hidden,
          default: "{{datetime}}",
        }
      - { name: publishedAt, label: Published at, widget: hidden }
      - {
          name: body,
          label: Body,
          widget: markdown,
          editor_components:
            [
              typewriter,
              contact,
              navigation,
              marquee,
              career,
              education,
              projects,
            ],
        }

  - name: education
    label: Education
    label_singular: Education Entry
    icon: school
    folder: src/data/education
    extension: json
    format: json
    create: true
    identifier_field: level
    summary: "{{level}} – {{institution}}"
    fields:
      - { name: level, label: Level, widget: string }
      - { name: institution, label: Institution, widget: string }
      - {
          name: url,
          label: Institution Website,
          widget: string,
          type: url,
          required: false,
          hint: "Used in the structured data for degrees only",
        }
      - { name: degree, label: Degree, widget: string }
      - {
          name: startDate,
          label: Start Date,
          widget: datetime,
          type: date,
          format: "YYYY-MM-DD",
        }
      - {
          name: endDate,
          label: End Date,
          widget: datetime,
          type: date,
          format: "YYYY-MM-DD",
          required: false,
          hint: 'Leave empty if still ongoing — shows as "present"',
        }
      - { name: location, label: Location, widget: string }
      - { name: description, label: Description, widget: markdown }
      - {
          name: grade,
          label: Grade,
          widget: number,
          value_type: float,
          min: 1.0,
          max: 6.0,
          step: 0.1,
          required: false,
        }
      - { name: isPublished, label: Published, widget: boolean, default: 0 }

  - name: projects
    label: Projects
    label_singular: Project
    icon: deployed_code
    folder: src/data/projects
    extension: json
    format: json
    create: true
    reorder: true
    thumbnail: image
    summary: "{{title}}"
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: Description, widget: text }
      - {
          name: repositoryURL,
          label: Repository URL,
          widget: string,
          type: url,
          required: false,
        }
      - {
          name: deployedURL,
          label: Deployed URL,
          widget: string,
          type: url,
          required: false,
        }
      - {
          name: state,
          label: State,
          widget: select,
          options: [Planned, WIP, Done, Maintenance],
        }
      - name: image
        label: Preview Image
        widget: image
        required: false
        media_folder: /src/assets/thumbnails
        public_folder: ../../assets/thumbnails
      - { name: isPublished, label: Published, widget: boolean, default: 0 }

  - name: career
    label: Career
    label_singular: Company Streak
    icon: work
    folder: src/data/career
    extension: json
    format: json
    create: true
    identifier_field: company
    summary: "{{company}} – {{location}}"
    fields:
      - { name: company, label: Company, widget: string }
      - { name: url, label: Company Website, widget: string, type: url }
      - { name: location, label: Location, widget: string }
      - name: jobs
        label: Positions
        label_singular: Position
        widget: list
        summary: "{{fields.title}}"
        hint: "Drag to reorder — this is the order shown on the site (newest on top)"
        fields:
          - { name: title, label: Title, widget: string }
          - {
              name: startDate,
              label: Start Date,
              widget: datetime,
              type: date,
              format: "YYYY-MM-DD",
            }
          - {
              name: endDate,
              label: End Date,
              widget: datetime,
              type: date,
              format: "YYYY-MM-DD",
              required: false,
              hint: 'Leave empty if still ongoing — shows as "present"',
            }
          - { name: description, label: Description, widget: markdown }
          - {
              name: technologies,
              label: Technologies,
              widget: list,
              required: false,
            }
      - { name: isPublished, label: Published, widget: boolean, default: 0 }

  - name: skills
    label: Skills
    label_singular: Skill Category
    icon: handyman
    folder: src/data/skills
    extension: json
    format: json
    create: true
    identifier_field: category
    summary: "{{category}}"
    fields:
      - {
          name: category,
          label: Category,
          widget: string,
          hint: 'e.g. "Tools", "Frameworks", "Languages"',
        }
      - name: skills
        label: Skills
        label_singular: Skill
        widget: list
        summary: "{{fields.name}}"
        fields:
          - { name: name, label: Name, widget: string }
          - name: image
            label: Icon
            widget: image
            required: false
            media_folder: /src/assets/icons/skills
            public_folder: ../../assets/icons/skills
            hint: "Required to show in the marquee. A skill without an icon stays on record but is never rendered."
          - {
              name: isPublished,
              label: Show on Site,
              widget: boolean,
              default: true,
            }

singletons:
  - name: siteInfo
    label: Site Info
    icon: info
    file: src/data/siteInfo.json
    fields:
      - { name: firstName, label: First Name, widget: string }
      - { name: lastName, label: Last Name, widget: string }
      - {
          name: fullName,
          label: Full Name,
          widget: compute,
          value: "{{fields.firstName}} {{fields.lastName}}",
        }
      - name: tagline
        label: Tagline
        widget: string
      - name: description
        label: Description
        widget: text

  - name: socialPreview
    label: Social Preview (Open Graph)
    icon: ios_share
    file: src/data/socialPreview.json
    fields:
      - name: image
        label: Share Image
        widget: object
        fields:
          - {
              name: src,
              label: Image,
              widget: image,
              media_folder: /public/og,
              public_folder: /og,
            }
          - { name: alt, label: Alt Text, widget: string }
      - {
          name: title,
          label: Share Title,
          widget: string,
          required: false,
          hint: "Overrides the page title inside the card only. Leave empty to use the page title. Cut off after roughly 60 characters.",
        }
      - {
          name: description,
          label: Share Description,
          widget: text,
          required: false,
          hint: "Overrides the meta description inside the card only. Leave empty to use the page description. Cut off after roughly 110 characters.",
        }
      - name: card
        label: Card Layout
        widget: select
        default: none
        hint: "Only X reads this. Everywhere else the large image is used regardless."
        options:
          - { label: "None", value: none }
          - { label: "Large image", value: summary_large_image }
          - { label: "Small square thumbnail", value: summary }
      - {
          name: twitterHandle,
          label: X Handle,
          widget: string,
          required: false,
          hint: "Including the @. Only used for the attribution line on X.",
        }

  - name: identity
    label: Identity (Structured Data)
    icon: badge
    file: src/data/identity.json
    hint: >-
      Feeds the JSON-LD Person graph on the homepage. Google requires that every
      fact marked up here is also visible in the page copy, so if you add
      something, put it in the introduction text too.
    fields:
      - {
          name: alternateName,
          label: Handle,
          widget: string,
          required: false,
          hint: "Other name you are known by, e.g. your GitHub handle. Tells search engines the handle and the name are the same person.",
        }
      - {
          name: jobTitle,
          label: Job Title,
          widget: string,
          hint: "Keep identical to the title used on LinkedIn, GitHub and in the site tagline.",
        }
      - name: description
        label: Description
        widget: text
        hint: 'Declarative third-person summary. Lead with "Christoph Merck is a…" so an AI answer engine can quote it directly. Include availability with an absolute date.'
      - {
          name: disambiguatingDescription,
          label: Disambiguating Description,
          widget: text,
          required: false,
          hint: "One line separating you from others with the same name.",
        }
      - {
          name: email,
          label: Email,
          widget: string,
          type: email,
          required: false,
        }
      - {
          name: sitePublished,
          label: Site First Published,
          widget: datetime,
          type: date,
          format: "YYYY-MM-DD",
          required: false,
          hint: 'Fixed date the site first went live. The "last modified" date is derived from git automatically and needs no field.',
        }
      - name: address
        label: Location
        widget: object
        hint: "Where you are based now."
        fields:
          - { name: locality, label: City, widget: string }
          - {
              name: region,
              label: Region / State,
              widget: string,
              required: false,
            }
          - {
              name: country,
              label: Country Code,
              widget: string,
              hint: "Two letters, e.g. DE",
            }
      - {
          name: workLocation,
          label: Willing to Work In,
          widget: list,
          required: false,
          hint: 'Places you would take a role in, e.g. "Germany". Separate from where you live.',
        }
      - name: knowsLanguage
        label: Languages
        label_singular: Language
        widget: list
        required: false
        summary: "{{fields.name}}"
        fields:
          - { name: name, label: Language, widget: string }
          - { name: code, label: Code, widget: string, hint: "e.g. de, en" }
      - {
          name: additionalSameAs,
          label: Additional Profile URLs,
          widget: list,
          required: false,
          hint: "Profiles beyond the Social Links list. Link back to this site from each one.",
        }
      - {
          name: orcid,
          label: ORCID iD,
          widget: string,
          required: false,
          hint: "Full URL. Free and permanent, but only feeds academic systems, not Google.",
        }
      - {
          name: image,
          label: Photograph,
          widget: image,
          required: false,
          media_folder: /public/og,
          public_folder: /og,
          hint: "Only set this once the photo is actually shown on the page.",
        }
      - {
          name: occupationalCategory,
          label: Occupation Code,
          widget: string,
          required: false,
          hint: "ISCO-08 or O*NET-SOC code. Setting this emits an Occupation node. No known consumer, safe to leave blank.",
        }
      - {
          name: awards,
          label: Awards,
          widget: list,
          required: false,
          hint: "Named, verifiable awards only.",
        }
      - {
          name: memberOf,
          label: Member Of,
          widget: list,
          required: false,
          hint: "Professional bodies only.",
        }

  - name: socialLinks
    label: Social Links
    icon: share
    file: src/data/socialLinks.json
    fields:
      - name: links
        label: Social Links
        label_singular: Social Link
        widget: list
        root: true
        summary: "{{fields.label}}"
        fields:
          - {
              name: label,
              label: Platform,
              widget: string,
              hint: 'Short platform name, e.g. "GitHub"',
            }
          - {
              name: text,
              label: Text,
              widget: string,
              hint: 'Longer descriptive label, e.g. "See my GitHub Projects"',
            }
          - { name: href, label: URL, widget: string, type: url }
          - name: icon
            label: Icon (SVG)
            widget: image
            media_folder: /src/assets/icons/social
            public_folder: ../assets/icons/social
          - {
              name: footerOnly,
              label: Footer only,
              widget: boolean,
              required: false,
            }
