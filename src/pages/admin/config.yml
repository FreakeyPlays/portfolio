# yaml-language-server: $schema=../../../node_modules/@sveltia/cms/schema/sveltia-cms.json

app_title: Portfolio CMS
publish_mode: editorial_workflow

editor:
  preview: false

output:
  omit_empty_optional_fields: true

slug:
  clean_accents: true

backend:
  name: github
  repo: FreakeyPlays/portfolio
  base_url: https://sveltia-cms-auth.chrissimerck.workers.dev
  cms_label_prefix: content/
  squash_merges: true
  commit_messages:
    create: 'content({{collection}}): add "{{slug}}"'
    update: 'content({{collection}}): update "{{slug}}"'
    delete: 'content({{collection}}): remove "{{slug}}"'
    uploadMedia: 'content(media): add "{{path}}"'
    deleteMedia: 'content(media): remove "{{path}}"'
    openAuthoring: "{{message}}"

media_folder: /src/assets
public_folder: /src/assets
media_libraries:
  default:
    config:
      max_file_size: 2000000
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 85
        svg:
          optimize: true

asset_collections:
  - name: images
    label: Images
    icon: image
    media_folder: /src/assets/images
    public_folder: /src/assets/images

  - name: icons
    label: Icons
    icon: interests
    media_folder: /src/assets/icons
    public_folder: /src/assets/icons

collections:
  - name: pages
    label: Pages
    label_singular: Page
    icon: description
    folder: src/content/pages
    extension: mdx
    reorder: true
    preview_path: "/{{fields.slug}}"
    identifier_field: title
    summary: "{{isPublished | ternary('', '(DRAFT) - ')}}{{title}}"
    slug: "{{slug}}"
    view_groups:
      - name: published
        label: Is Published
        field: isPublished
      - name: indexed
        label: Not Indexed
        field: noIndex
    view_filters:
      - name: draft
        label: Draft
        field: isPublished
        pattern: false
      - name: published
        label: Published
        field: isPublished
        pattern: true
      - name: indexed
        label: Indexed
        field: noIndex
        pattern: false
      - name: notIndexed
        label: Not Indexed
        field: noIndex
        pattern: true
    fields:
      - name: id
        widget: hidden
        default: "{{uuid}}"
      - name: title
        label: Title
        widget: string
        pattern:
          - '^(?!\s*(?:[Ii][Nn][Dd][Ee][Xx])\s*$).+'
          - The Homepage can be created via the name Home.
      - name: slug
        label: Slug
        widget: compute
        value: "{{fields.title | default('untitled') | slugify}}"
      - name: description
        label: Description
        widget: text
        required: false
        hint: Meta description. Leave empty to fall back to the site default.
      - name: isPublished
        label: Published
        widget: boolean
        default: false
      - name: createdAt
        widget: hidden
        default: "{{datetime}}"
      - name: updatedAt
        widget: hidden
        default: "{{datetime}}"
      - name: publishedAt
        widget: hidden
      - name: noIndex
        label: Remove from Indexing
        widget: boolean
        default: false
        required: true
      - name: body
        label: Body
        widget: markdown
        editor_components:
          - typewriter
          - contact
          - navigation
          - marquee
          - career
          - education
          - projects
          - postList

  - name: posts
    label: Posts
    label_singular: Post
    icon: history_edu
    folder: src/content/posts
    extension: mdx
    reorder: true
    preview_path: "/blog/{{fields.slug}}"
    identifier_field: title
    summary: "{{isPublished | ternary('', '(DRAFT) - ')}}{{title}}"
    slug: "post-{{order}}-{{slug}}"
    fields:
      - name: id
        widget: hidden
        default: "{{uuid}}"
      - name: image
        label: Image
        widget: image
      - name: title
        label: Title
        widget: string
      - name: slug
        label: Slug
        widget: string
        before_input: .com/blog/
        pattern:
          - ^[a-z0-9]*(?:-[a-z0-9]+)*$
          - String must be lowercase letters and may contain hyphens. No other special characters are allowed.
      - name: description
        label: Description
        widget: markdown
        buttons:
          - bold
          - italic
        editor_components: []
      - name: body
        label: Body
        widget: markdown
        editor_components: [image, code-block]
        buttons:
          [
            heading-two,
            heading-three,
            heading-four,
            heading-five,
            heading-six,
            bulleted-list,
            numbered-list,
            bold,
            italic,
            strikethrough,
            code,
            link,
          ]
      - name: relatedPosts
        label: Related Posts
        widget: relation
        collection: posts
        required: false
        multiple: true
        max: 2
        dropdown_threshold: 0
        value_field: id
        display_fields: ["title"]
        search_fields: ["title"]
        filters:
          - field: id
            values: ["{{id}}"]
            exclude: true
      - name: faq
        label: FAQ
        widget: list
        required: false
        collapsed: true
        fields:
          - name: question
            label: Question
            widget: string
          - name: answer
            label: Answer
            widget: markdown
            buttons:
              - bold
              - italic
              - link
            editor_components: []
      - name: tags
        label: Tags
        widget: relation
        collection: meta
        file: tags
        multiple: true
        min: 1
        value_field: "{{tags.*.id}}"
        display_fields: ["{{tags.*.label}}"]
        search_fields: ["{{tags.*.label}}"]
        dropdown_threshold: 0
      - name: category
        label: Category
        widget: relation
        collection: meta
        file: categories
        value_field: "{{categories.*.id}}"
        display_fields: ["{{categories.*.label}}"]
        search_fields: ["{{categories.*.label}}"]
        dropdown_threshold: 0
      - name: isPublished
        label: Is Published
        widget: boolean
        default: false
      - name: createdAt
        widget: hidden
        default: "{{datetime}}"
      - name: updatedAt
        widget: hidden
        default: "{{datetime}}"
      - name: publishedAt
        widget: hidden

  - name: skills
    label: Skills
    label_singular: Skill Collection
    icon: handyman
    folder: src/data/skills
    format: json
    reorder: true
    identifier_field: category
    summary: "{{category}}"
    slug: "{{category | slugify}}"
    fields:
      - name: id
        widget: hidden
        default: "{{uuid}}"
      - name: category
        label: Category
        widget: string
        hint: 'e.g. "Tools", "Frameworks", "Languages"'
      - name: hidden
        label: Hidden
        widget: boolean
        default: false
      - name: skills
        label: Skills
        label_singular: Skill
        widget: list
        summary: "{{fields.name}}"
        fields:
          - name: name
            label: Name
            widget: string
          - name: icon
            label: Icon
            widget: image
            required: false
            accept: image/svg+xml
            hint: SVG only. The site renders it inline, so it can be recolored.
          - name: hidden
            label: Hidden
            widget: boolean
            default: false

  - name: career
    label: Career
    label_singular: Career Entry
    icon: work
    folder: src/data/career
    format: json
    reorder: true
    identifier_field: company
    summary: "{{company}}"
    slug: "{{year}}-{{company | slugify}}"
    fields:
      - name: id
        widget: hidden
        default: "{{uuid}}"
      - name: company
        label: Company
        widget: string
      - name: url
        label: Company Website
        widget: string
        type: url
      - name: location
        label: Location
        widget: string
      - name: jobs
        label: Positions
        label_singular: Position
        widget: list
        summary: "{{fields.title}}"
        fields:
          - name: title
            label: Title
            widget: string
          - name: startDate
            label: Start Date
            widget: datetime
            type: date
            format: YYYY-MM-DD
          - name: endDate
            label: End Date
            widget: datetime
            type: date
            format: YYYY-MM-DD
            required: false
            hint: Leave empty if still ongoing — shows as "present"
          - name: description
            label: Description
            widget: markdown
          - name: technologies
            label: Technologies
            widget: list
            required: false
      - name: hidden
        label: Hidden
        widget: boolean
        default: true

  - name: education
    label: Education
    label_singular: Education Entry
    icon: school
    folder: src/data/education
    format: json
    reorder: true
    identifier_field: institution
    summary: "{{level}} – {{institution}}"
    slug: "{{level | slugify}}-{{institution | slugify}}"
    fields:
      - name: id
        widget: hidden
        default: "{{uuid}}"
      - name: level
        label: Level
        widget: string
      - name: institution
        label: Institution
        widget: string
      - name: url
        label: Institution Website
        widget: string
        type: url
      - name: degree
        label: Degree
        widget: string
      - name: startDate
        label: Start Date
        widget: datetime
        type: date
        format: YYYY-MM-DD
      - name: endDate
        label: End Date
        widget: datetime
        type: date
        format: YYYY-MM-DD
        required: false
        hint: Leave empty if still ongoing — shows as "present"
      - name: location
        label: Location
        widget: string
      - name: grade
        label: Grade
        widget: number
        value_type: float
        min: 1
        max: 6
        step: 0.1
      - name: hidden
        label: Hidden
        widget: boolean
        default: true
      - name: description
        label: Description
        widget: markdown
        buttons: [bold, italic, link]
        editor_components: []

  - name: projects
    label: Projects
    label_singular: Project
    icon: handyman
    folder: src/data/projects
    format: json
    reorder: true
    identifier_field: title
    summary: "{{title}}"
    slug: "{{title | slugify}}"
    fields:
      - name: id
        widget: hidden
        default: "{{uuid}}"
      - name: title
        label: Title
        widget: string
      - name: description
        label: Description
        widget: markdown
        buttons: [bold, italic, link]
        editor_components: []
      - name: repositoryURL
        label: Repository URL
        widget: string
        type: url
        required: false
      - name: deployedURL
        label: Deployed URL
        widget: string
        type: url
        required: false
      - name: relatedBlogPost
        label: Related Blog Post
        widget: relation
        collection: posts
        dropdown_threshold: 0
        value_field: "id"
        display_fields: ["title"]
        search_fields: ["title"]
        required: false
      - name: state
        label: State
        widget: select
        options:
          - Planned
          - WIP
          - Done
          - Maintenance
      - name: image
        label: Preview Image
        widget: image
        required: false
      - name: hidden
        label: Hidden
        widget: boolean
        default: true

  - name: meta
    label: Meta
    files:
      - name: tags
        label: Tags
        file: src/data/meta/tags.json
        fields:
          - name: tags
            label: Tags
            widget: list
            root: true
            fields:
              - name: id
                widget: hidden
                default: "{{uuid}}"
              - name: label
                label: Label
                widget: string
              - name: slug
                widget: compute
                value: "{{label | default('undefined') | slugify}}"

      - name: categories
        label: Categories
        file: src/data/meta/categories.json
        fields:
          - name: categories
            label: Categories
            widget: list
            root: true
            fields:
              - name: id
                widget: hidden
                default: "{{uuid}}"
              - name: label
                label: Label
                widget: string
              - name: slug
                widget: compute
                value: "{{label | default('undefined') | slugify}}"

      - name: headers
        label: Headers
        file: public/_headers
        fields:
          - name: body
            label: Headers
            widget: code
            output_code_only: true
            allow_language_selection: false

      - name: redirects
        label: Redirects
        file: public/_redirects
        fields:
          - name: body
            label: Redirects
            widget: code
            output_code_only: true
            allow_language_selection: false

singletons:
  - name: personal
    label: Personal
    icon: person
    file: src/data/personal.json
    fields:
      - name: firstName
        label: First Name
        widget: string
      - name: lastName
        label: Last Name
        widget: string
      - name: alternateName
        label: Handle
        widget: string
        required: false
        hint: >-
          Other name you are known by, e.g. your GitHub handle. Tells search
          engines the handle and the name are the same person.
      - name: jobTitle
        label: Job Title
        widget: string
        hint: >-
          Keep identical to the title used on LinkedIn, GitHub and in the
          tagline.
      - name: tagline
        label: Tagline
        widget: string
        hint: One line after your name in the browser tab title.
      - name: bio
        label: Biography
        widget: object
        fields:
          - name: long
            label: Full Biography
            widget: text
            hint: >-
              Declarative third-person summary. Lead with "Christoph Merck is
              a…" so an AI answer engine can quote it directly. Include
              availability with an absolute date.
          - name: short
            label: Short Biography
            widget: text
            required: false
            hint: One line separating you from others with the same name.
      - name: email
        label: Email
        widget: string
        type: email
      - name: orcid
        label: ORCID iD
        widget: string
        type: url
        required: false
      - name: image
        label: Photograph
        widget: image
        required: false
        hint: Only set this once the photo is actually shown on the page.
      - name: location
        label: Location
        widget: object
        hint: Where you are based now.
        summary: "{{locality}}, {{country}}"
        collapsed: true
        fields:
          - name: locality
            label: City
            widget: string
          - name: region
            label: Region / State
            widget: string
            required: false
          - name: country
            label: Country Code
            widget: string
            hint: "Two letters, e.g. DE"
      - name: workLocation
        label: Willing to Work In
        widget: list
        required: false
        hint: >-
          Places you would take a role in, e.g. "Germany". Separate from where
          you live.
      - name: languages
        label: Languages
        label_singular: Language
        widget: list
        required: false
        summary: "{{name}}"
        collapsed: true
        fields:
          - name: name
            label: Language
            widget: string
          - name: code
            label: Code
            widget: string
            hint: "e.g. de, en"

  - name: site
    label: Site
    icon: language
    file: src/data/site.json
    fields:
      - name: launchedAt
        label: First Published
        widget: datetime
        type: date
        format: YYYY-MM-DD
      - name: description
        label: Default Description
        widget: text
        hint: >-
          Meta description for any page that does not set its own. Describes the
          site, so first person is fine here.
      - name: socialPreview
        label: Social Preview (Open Graph)
        widget: object
        collapsed: true
        fields:
          - name: image
            label: Share Image
            widget: object
            fields:
              - name: src
                label: Image
                widget: image
              - name: alt
                label: Alt Text
                widget: string
          - name: title
            label: Share Title
            widget: string
            required: false
            hint: >-
              Overrides the page title inside the card only. Leave empty to use
              the page title. Cut off after roughly 60 characters.
          - name: description
            label: Share Description
            widget: text
            required: false
            hint: >-
              Overrides the meta description inside the card only. Leave empty
              to use the page description. Cut off after roughly 110 characters.

  - name: socials
    label: Socials
    icon: share
    file: src/data/socials.json
    fields:
      - name: socials
        label: Socials
        label_singular: Social
        widget: list
        collapsed: true
        root: true
        summary: "{{label}}"
        fields:
          - name: label
            label: Platform
            widget: string
            hint: 'Short platform name, e.g. "GitHub"'
          - name: text
            label: Text
            widget: string
            hint: 'Longer descriptive label, e.g. "See my GitHub Projects"'
          - name: href
            label: URL
            widget: string
            type: url
          - name: icon
            label: Icon
            widget: image
            accept: image/svg+xml
            hint: SVG only. The site renders it inline, so it can be recolored.
